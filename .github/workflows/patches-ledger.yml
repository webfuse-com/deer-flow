# Enforce the PATCHES.md hard rule: a patch that is not in the ledger does not
# exist. Until 2026-09-02 this matched only the literal subject "[argus] patch
# #NN"; the commit convention moved on in August and eleven patches landed with
# no entry. scripts/check_patches_ledger.py now checks the ledger's own
# consistency, every "patch #N" named in the PR's commits, and that a code
# change either updates PATCHES.md or declares "Ledger: none (<reason>)" in the
# PR body. See the script header for the rules.
name: patches-ledger
on: [pull_request]
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ledger consistent, commits recorded, code changes declared
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          printf '%s' "${PR_BODY}" > /tmp/pr-body.txt
          python3 scripts/check_patches_ledger.py \
            --range "origin/${{ github.base_ref }}..HEAD" \
            --changed-files /tmp/changed.txt --pr-body /tmp/pr-body.txt
