name: Skill Review CI

on:
  push:
    branches: ["main", "2.0.x-dev", "argus"]
    paths:
      - "skills/public/**"
      - "backend/packages/harness/deerflow/skills/review/**"
      - "contracts/skill_review/**"
      - "scripts/review_changed_public_skills.py"
      - "scripts/skill_review_waivers.py"
      - ".github/skill-review-waivers.v1.json"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/skill-review-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skills/public/**"
      - "backend/packages/harness/deerflow/skills/review/**"
      - "contracts/skill_review/**"
      - "scripts/review_changed_public_skills.py"
      - "scripts/skill_review_waivers.py"
      - ".github/skill-review-waivers.v1.json"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/skill-review-ci.yml"

concurrency:
  group: skill-review-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  skill-review:
    # [argus] This fork authors no public skills: `git diff --name-only
    # <upstream-base> -- skills/` is empty, and the Argus skills live in the
    # acropolis repo, not here. So the only thing that ever changes under
    # skills/public/ on this branch is upstream's own content arriving with a
    # sync, and reviewing it means failing on findings in a tree we do not own
    # -- twice per sync, on the sync PR and on the push that merges it. The
    # 2026-09-11 sync failed exactly that way on upstream's skill-creator
    # package. Skip those two; a PR that genuinely adds or edits a skill here
    # still runs the full review.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && !startsWith(github.head_ref, 'sync/upstream-')
      && !contains(github.event.head_commit.message, 'sync/upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Must match backend/Dockerfile's UV_IMAGE tag; pinned by backend/tests/test_ci_uv_version_pin.py
          version: "0.11.1"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Review changed public skills (pull request)
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: |
          uv run python ../scripts/review_changed_public_skills.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Review changed public skills (push)
        if: github.event_name == 'push'
        working-directory: backend
        run: |
          uv run python ../scripts/review_changed_public_skills.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.event.after }}"
