name: E2E Tests

on:
  push:
    branches: [ 'main', '*-dev', 'argus' ]
    paths:
      - 'frontend/**'
      - 'backend/app/gateway/routers/plugins.py'
      - 'backend/extension_test_fixtures/bookmark_plugin_gateway.py'
      - 'backend/extension_test_fixtures/browser_asset_gateway.py'
      - 'backend/packages/extension-api/**'
      - 'backend/packages/harness/deerflow/extensions/**'
      - 'backend/packages/harness/deerflow/config/plugin_settings.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'examples/deerflow-extension-bookmarks/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - 'backend/app/gateway/routers/plugins.py'
      - 'backend/extension_test_fixtures/bookmark_plugin_gateway.py'
      - 'backend/extension_test_fixtures/browser_asset_gateway.py'
      - 'backend/packages/extension-api/**'
      - 'backend/packages/harness/deerflow/extensions/**'
      - 'backend/packages/harness/deerflow/config/plugin_settings.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'examples/deerflow-extension-bookmarks/**'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests-shard:
    # [argus] The suite (400+ tests) runs serially per job (workers: 1 in CI),
    # which made this the slowest check (~14 min). Three Playwright shards run
    # in parallel; each keeps workers: 1, so no test sees new concurrency. The
    # aggregate job below keeps the `e2e-tests` name for anything that keys on it.
    name: e2e-tests-shard ${{ matrix.shard }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The bookmark browser test starts the real Python action/router fixture.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Keep aligned with backend/Dockerfile and other backend workflows.
          version: "0.11.1"

      - name: Install backend dependencies (bookmark plugin gateway)
        working-directory: backend
        run: uv sync --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (shard ${{ matrix.shard }} of 3)
        working-directory: frontend
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Run auth recovery E2E tests
        if: ${{ matrix.shard == 1 }}
        working-directory: frontend
        run: pnpm exec playwright test -c playwright.auth.config.ts
        env:
          SKIP_ENV_VALIDATION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

  e2e-tests:
    name: e2e-tests
    # [argus] Green only when every shard passed; a cancelled or skipped shard
    # is a failure here, not a silent pass (same pattern as backend-unit-tests).
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [e2e-tests-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard passed
        run: |
          result='${{ needs.e2e-tests-shard.result }}'
          echo "shards: ${result}"
          test "${result}" = success
